<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#b0a4fd"/>
      <stop offset="50%"  stop-color="#7c6af7"/>
      <stop offset="100%" stop-color="#5038d0"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Glass highlight -->
  <rect width="1024" height="1024" rx="220" fill="url(#shine)" clip-path="url(#squircle)"/>

  <!--
    DM Sans Medium proportions — rx=14 (subtle, not bubbly)
    Baseline: y=648  |  x-height top: y=334  |  descender: y=790
    Stroke weight: 70px  |  horizontal centre: x=512

    't' stem:     x=280  y=240  w=70  h=408  (top above x-height, bottom=baseline)
    't' crossbar: x=202  y=322  w=220 h=58   (sits right at x-height)
    'p' stem:     x=438  y=334  w=70  h=456  (x-height top → descender)
    'p' bowl:     cx=665 cy=491 r=122        (outer r=157: left=508=stem-right, bottom=648=baseline)
    Horizontal span: 202 → 822, centre=512 ✓
  -->

  <!-- t : stem -->
  <rect x="280" y="240" width="70" height="408" rx="14" fill="white"/>
  <!-- t : crossbar -->
  <rect x="202" y="322" width="220" height="58" rx="14" fill="white"/>

  <!-- p : stem (x-height → descender) -->
  <rect x="438" y="334" width="70" height="456" rx="14" fill="white"/>
  <!-- p : hollow bowl (ring) -->
  <circle cx="665" cy="491" r="122" fill="none" stroke="white" stroke-width="70"/>
</svg>
